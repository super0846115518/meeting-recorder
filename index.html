<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>智慧會議錄音系統</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f3f5f7;
  color: #202124;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;
}

.container {
  width: 100%;
  max-width: 680px;
  margin: auto;
  padding: 16px;
}

.header {
  text-align: center;
  padding: 12px 0 20px;
}

.header h1 {
  margin: 0;
  font-size: 26px;
}

.header p {
  margin: 8px 0 0;
  color: #6b7280;
  font-size: 14px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 15px;
  box-shadow: 0 3px 14px rgba(0,0,0,.07);
}

label {
  display: block;
  font-weight: 700;
  margin-bottom: 8px;
}

input,
select {
  width: 100%;
  border: 1px solid #d0d5da;
  border-radius: 12px;
  padding: 14px;
  font-size: 16px;
  background: white;
}

.status {
  text-align: center;
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 12px;
}

.recording {
  color: #c62828;
}

.idle {
  color: #555;
}

.rotating {
  color: #e65100;
}

.timer {
  text-align: center;
  font-size: 52px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: 2px;
  margin: 10px 0 4px;
}

.segment-info {
  text-align: center;
  color: #666;
  font-size: 14px;
  margin-bottom: 20px;
}

.progress-box {
  height: 8px;
  background: #eeeeee;
  border-radius: 8px;
  overflow: hidden;
  margin: 12px 0 20px;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: #1976d2;
  transition: width .3s linear;
}

button {
  width: 100%;
  border: 0;
  border-radius: 14px;
  padding: 16px;
  margin-top: 10px;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
}

.start {
  background: #1976d2;
  color: white;
}

.stop {
  background: #d32f2f;
  color: white;
}

.secondary {
  background: #eeeeee;
  color: #222;
}

button:disabled {
  opacity: .45;
}

.segment {
  border: 1px solid #e0e0e0;
  border-radius: 12px;
  padding: 14px;
  margin-top: 10px;
}

.segment-title {
  font-weight: 700;
}

.segment-meta {
  color: #666;
  font-size: 13px;
  margin-top: 5px;
  line-height: 1.6;
}

.segment audio {
  width: 100%;
  margin-top: 10px;
}

.success {
  background: #e8f5e9;
  color: #1b5e20;
  padding: 12px;
  border-radius: 10px;
  margin-top: 12px;
}

.error {
  background: #ffebee;
  color: #b71c1c;
  padding: 12px;
  border-radius: 10px;
  margin-top: 12px;
  white-space: pre-wrap;
  word-break: break-word;
}

.warning {
  background: #fff8e1;
  color: #7a5200;
  padding: 12px;
  border-radius: 10px;
  margin-top: 12px;
}

.diagnostic {
  font-family: monospace;
  font-size: 12px;
  line-height: 1.7;
  background: #f7f7f7;
  border-radius: 10px;
  padding: 12px;
  word-break: break-word;
}

.hidden {
  display: none;
}

.summary-row {
  display: flex;
  justify-content: space-between;
  padding: 7px 0;
  border-bottom: 1px solid #eee;
  gap: 15px;
}

.summary-row:last-child {
  border-bottom: 0;
}

.summary-row strong {
  text-align: right;
}

</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>🎙️ 智慧會議錄音系統</h1>
    <p>Android Chrome 長時間自動分段錄音</p>
  </div>


  <!-- ==============================
       會議設定
  =============================== -->

  <div class="card">

    <label for="meetingName">
      會議名稱
    </label>

    <input
      id="meetingName"
      type="text"
      placeholder="例如：工程進度會議"
    >

    <br><br>

    <label for="segmentMinutes">
      自動分段時間
    </label>

    <select id="segmentMinutes">

      <option value="5">
        每 5 分鐘
      </option>

      <option value="10" selected>
        每 10 分鐘
      </option>

      <option value="20">
        每 20 分鐘
      </option>

      <option value="30">
        每 30 分鐘
      </option>

      <option value="60">
        每 60 分鐘
      </option>

    </select>

  </div>


  <!-- ==============================
       錄音控制
  =============================== -->

  <div class="card">

    <div
      id="status"
      class="status idle"
    >
      尚未開始錄音
    </div>

    <div
      id="timer"
      class="timer"
    >
      00:00:00
    </div>

    <div
      id="segmentInfo"
      class="segment-info"
    >
      尚無錄音分段
    </div>

    <div class="progress-box">
      <div
        id="progressBar"
        class="progress-bar"
      ></div>
    </div>

    <button
      id="startBtn"
      class="start"
    >
      🎙️ 開始會議錄音
    </button>

    <button
      id="stopBtn"
      class="stop"
      disabled
    >
      ⏹ 結束會議
    </button>

    <div
      id="message"
      class="hidden"
    ></div>

  </div>


  <!-- ==============================
       會議統計
  =============================== -->

  <div class="card">

    <h3>📊 錄音狀態</h3>

    <div class="summary-row">
      <span>會議名稱</span>
      <strong id="summaryName">-</strong>
    </div>

    <div class="summary-row">
      <span>分段設定</span>
      <strong id="summaryInterval">-</strong>
    </div>

    <div class="summary-row">
      <span>目前分段</span>
      <strong id="summaryCurrentSegment">0</strong>
    </div>

    <div class="summary-row">
      <span>已完成分段</span>
      <strong id="summarySegments">0</strong>
    </div>

    <div class="summary-row">
      <span>總錄音時間</span>
      <strong id="summaryDuration">00:00:00</strong>
    </div>

  </div>


  <!-- ==============================
       錄音分段
  =============================== -->

  <div class="card">

    <h3>🎧 錄音分段</h3>

    <div id="segments">
      尚無完成的錄音分段
    </div>

  </div>


  <!-- ==============================
       系統診斷
  =============================== -->

  <div class="card">

    <h3>🔧 系統診斷</h3>

    <div
      id="diagnostic"
      class="diagnostic"
    ></div>

  </div>

</div>


<script>

/* =====================================================
   全域變數
===================================================== */

let mediaStream = null;

let mediaRecorder = null;

let audioChunks = [];

let segmentIndex = 0;

let segmentStartTime = null;

let meetingStartTime = null;

let totalTimer = null;

let segmentTimer = null;

let isRecording = false;

let stoppingMeeting = false;

let rotatingSegment = false;

let completedSegmentCount = 0;


/* =====================================================
   DOM
===================================================== */

const meetingName =
  document.getElementById("meetingName");

const segmentMinutes =
  document.getElementById("segmentMinutes");

const startBtn =
  document.getElementById("startBtn");

const stopBtn =
  document.getElementById("stopBtn");

const statusEl =
  document.getElementById("status");

const timerEl =
  document.getElementById("timer");

const segmentInfo =
  document.getElementById("segmentInfo");

const progressBar =
  document.getElementById("progressBar");

const messageEl =
  document.getElementById("message");

const segmentsEl =
  document.getElementById("segments");

const diagnosticEl =
  document.getElementById("diagnostic");

const summaryName =
  document.getElementById("summaryName");

const summaryInterval =
  document.getElementById("summaryInterval");

const summaryCurrentSegment =
  document.getElementById(
    "summaryCurrentSegment"
  );

const summarySegments =
  document.getElementById(
    "summarySegments"
  );

const summaryDuration =
  document.getElementById(
    "summaryDuration"
  );


/* =====================================================
   格式化時間
===================================================== */

function formatTime(seconds) {

  seconds =
    Math.max(
      0,
      Math.floor(seconds)
    );

  const h =
    Math.floor(seconds / 3600)
      .toString()
      .padStart(2, "0");

  const m =
    Math.floor(
      (seconds % 3600) / 60
    )
      .toString()
      .padStart(2, "0");

  const s =
    (seconds % 60)
      .toString()
      .padStart(2, "0");

  return `${h}:${m}:${s}`;
}


/* =====================================================
   檔案大小
===================================================== */

function formatBytes(bytes) {

  if (!bytes) {
    return "0 Bytes";
  }

  const units = [
    "Bytes",
    "KB",
    "MB",
    "GB"
  ];

  const i =
    Math.floor(
      Math.log(bytes) /
      Math.log(1024)
    );

  return (
    (bytes /
      Math.pow(1024, i))
      .toFixed(2)
    + " "
    + units[i]
  );
}


/* =====================================================
   訊息
===================================================== */

function showMessage(
  text,
  type = "success"
) {

  messageEl.className =
    type;

  messageEl.textContent =
    text;

}


function clearMessage() {

  messageEl.className =
    "hidden";

  messageEl.textContent =
    "";

}


/* =====================================================
   麥克風診斷
===================================================== */

async function runDiagnostics() {

  let permissionState =
    "unknown";

  try {

    if (
      navigator.permissions
    ) {

      const permission =
        await navigator.permissions.query({
          name: "microphone"
        });

      permissionState =
        permission.state;
    }

  } catch (error) {

    permissionState =
      "無法取得";

  }


  diagnosticEl.innerHTML =

    "HTTPS / Secure Context："
    + (
      window.isSecureContext
        ? "OK"
        : "FAIL"
    )

    + "<br>"

    + "navigator.mediaDevices："
    + (
      navigator.mediaDevices
        ? "OK"
        : "FAIL"
    )

    + "<br>"

    + "getUserMedia："
    + (
      navigator.mediaDevices &&
      navigator.mediaDevices.getUserMedia
        ? "OK"
        : "FAIL"
    )

    + "<br>"

    + "MediaRecorder："
    + (
      window.MediaRecorder
        ? "OK"
        : "FAIL"
    )

    + "<br>"

    + "麥克風 Permission State："
    + permissionState

    + "<br>"

    + "瀏覽器："
    + navigator.userAgent;

}

runDiagnostics();


/* =====================================================
   更新計時器
===================================================== */

function updateTimers() {

  if (!meetingStartTime) {
    return;
  }


  const now =
    Date.now();


  const totalSeconds =
    (
      now -
      meetingStartTime
    ) / 1000;


  timerEl.textContent =
    formatTime(totalSeconds);


  summaryDuration.textContent =
    formatTime(totalSeconds);


  if (segmentStartTime) {

    const segmentSeconds =
      (
        now -
        segmentStartTime
      ) / 1000;


    const limitSeconds =
      Number(
        segmentMinutes.value
      ) * 60;


    const percentage =
      Math.min(
        100,
        (
          segmentSeconds /
          limitSeconds
        ) * 100
      );


    progressBar.style.width =
      percentage + "%";


    segmentInfo.textContent =
      `第 ${segmentIndex} 段｜`
      + `本段 ${formatTime(segmentSeconds)} / `
      + `${formatTime(limitSeconds)}`;

  }

}


/* =====================================================
   建立 MediaRecorder
===================================================== */

function createRecorder() {

  let mimeType = "";


  if (
    MediaRecorder.isTypeSupported(
      "audio/webm;codecs=opus"
    )
  ) {

    mimeType =
      "audio/webm;codecs=opus";

  } else if (
    MediaRecorder.isTypeSupported(
      "audio/webm"
    )
  ) {

    mimeType =
      "audio/webm";

  }


  const options =
    mimeType
      ? { mimeType }
      : undefined;


  return new MediaRecorder(
    mediaStream,
    options
  );
}


/* =====================================================
   啟動分段
===================================================== */

function startSegment() {

  if (
    !mediaStream ||
    !isRecording
  ) {

    return;

  }


  audioChunks = [];

  rotatingSegment = false;

  segmentIndex++;

  segmentStartTime =
    Date.now();


  mediaRecorder =
    createRecorder();


  mediaRecorder.ondataavailable =
    function(event) {

      if (
        event.data &&
        event.data.size > 0
      ) {

        audioChunks.push(
          event.data
        );

      }

    };


  mediaRecorder.onerror =
    function(event) {

      showMessage(
        "錄音發生錯誤："
        + (
          event.error
            ? event.error.message
            : "未知錯誤"
        ),
        "error"
      );

    };


  mediaRecorder.onstop =
    function() {

      finishSegment();

    };


  mediaRecorder.start(1000);


  statusEl.textContent =
    `🔴 錄音中｜第 ${segmentIndex} 段`;

  statusEl.className =
    "status recording";


  summaryCurrentSegment.textContent =
    segmentIndex;


  segmentInfo.textContent =
    `第 ${segmentIndex} 段正在錄音`;

}


/* =====================================================
   完成分段
===================================================== */

function finishSegment() {

  const recorder =
    mediaRecorder;


  const blob =
    new Blob(
      audioChunks,
      {
        type:
          recorder.mimeType ||
          "audio/webm"
      }
    );


  const endTime =
    Date.now();


  const duration =
    (
      endTime -
      segmentStartTime
    ) / 1000;


  completedSegmentCount++;


  saveSegment(
    blob,
    segmentIndex,
    duration
  );


  summarySegments.textContent =
    completedSegmentCount;


  audioChunks = [];


  /*
   * 如果使用者已經按下「結束會議」
   * 就不要重新開始。
   */

  if (
    stoppingMeeting ||
    !isRecording
  ) {

    finishMeetingAfterLastSegment();

    return;

  }


  /*
   * 正常自動切段
   */

  statusEl.textContent =
    `⏳ 第 ${segmentIndex} 段完成，`
    + `準備開始第 ${segmentIndex + 1} 段`;

  statusEl.className =
    "status rotating";


  progressBar.style.width =
    "0%";


  /*
   * 稍微等待，讓前一段
   * onstop / Blob 完整處理後
   * 再建立下一個 Recorder。
   */

  setTimeout(
    function() {

      if (
        isRecording &&
        !stoppingMeeting
      ) {

        startSegment();

      }

    },
    300
  );

}


/* =====================================================
   儲存分段到目前瀏覽器記憶體
===================================================== */

function saveSegment(
  blob,
  index,
  duration
) {

  const url =
    URL.createObjectURL(
      blob
    );


  if (
    segmentsEl.textContent ===
    "尚無完成的錄音分段"
  ) {

    segmentsEl.innerHTML =
      "";

  }


  const wrapper =
    document.createElement(
      "div"
    );

  wrapper.className =
    "segment";


  const title =
    document.createElement(
      "div"
    );

  title.className =
    "segment-title";

  title.textContent =
    `第 ${index} 段`;


  const meta =
    document.createElement(
      "div"
    );

  meta.className =
    "segment-meta";

  meta.textContent =
    `時間：${formatTime(duration)}｜`
    + `大小：${formatBytes(blob.size)}｜`
    + `格式：${blob.type}`;


  const audio =
    document.createElement(
      "audio"
    );

  audio.controls =
    true;

  audio.preload =
    "metadata";

  audio.src =
    url;


  const download =
    document.createElement(
      "button"
    );

  download.className =
    "secondary";

  download.textContent =
    `⬇️ 儲存第 ${index} 段`;


  download.onclick =
    function() {

      const a =
        document.createElement(
          "a"
        );


      a.href =
        url;


      const safeName =
        (
          meetingName.value.trim() ||
          "meeting"
        )
        .replace(
          /[\\/:*?"<>|]/g,
          "_"
        );


      a.download =
        `${safeName}_`
        + `segment_`
        + `${String(index).padStart(3, "0")}`
        + `.webm`;


      document.body.appendChild(a);

      a.click();

      a.remove();

    };


  wrapper.appendChild(
    title
  );

  wrapper.appendChild(
    meta
  );

  wrapper.appendChild(
    audio
  );

  wrapper.appendChild(
    download
  );


  segmentsEl.prepend(
    wrapper
  );

}


/* =====================================================
   檢查是否到達分段時間
===================================================== */

function checkSegmentLimit() {

  if (
    !isRecording ||
    !segmentStartTime ||
    rotatingSegment
  ) {

    return;

  }


  const elapsed =
    (
      Date.now() -
      segmentStartTime
    ) / 1000;


  const limit =
    Number(
      segmentMinutes.value
    ) * 60;


  if (
    elapsed >= limit
  ) {

    rotateSegment();

  }

}


/* =====================================================
   執行自動切段
===================================================== */

function rotateSegment() {

  if (
    !mediaRecorder ||
    mediaRecorder.state ===
    "inactive"
  ) {

    return;

  }


  if (rotatingSegment) {
    return;
  }


  rotatingSegment =
    true;


  statusEl.textContent =
    `⏳ 正在完成第 ${segmentIndex} 段`;

  statusEl.className =
    "status rotating";


  mediaRecorder.stop();

}


/* =====================================================
   開始會議
===================================================== */

async function startMeeting() {

  clearMessage();


  if (
    !window.isSecureContext
  ) {

    showMessage(
      "目前不是 HTTPS 安全環境。",
      "error"
    );

    return;

  }


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    showMessage(
      "此瀏覽器不支援麥克風。",
      "error"
    );

    return;

  }


  if (
    isRecording
  ) {

    return;

  }


  if (
    !meetingName.value.trim()
  ) {

    meetingName.value =
      "未命名會議";

  }


  try {

    statusEl.textContent =
      "正在取得麥克風權限…";


    mediaStream =
      await navigator.mediaDevices.getUserMedia({

        audio: {

          echoCancellation: true,

          noiseSuppression: true,

          autoGainControl: true

        }

      });


    meetingStartTime =
      Date.now();


    segmentIndex =
      0;


    completedSegmentCount =
      0;


    isRecording =
      true;


    stoppingMeeting =
      false;


    rotatingSegment =
      false;


    summaryName.textContent =
      meetingName.value.trim();


    summaryInterval.textContent =
      `每 ${segmentMinutes.value} 分鐘`;


    summaryCurrentSegment.textContent =
      "0";


    summarySegments.textContent =
      "0";


    summaryDuration.textContent =
      "00:00:00";


    timerEl.textContent =
      "00:00:00";


    progressBar.style.width =
      "0%";


    segmentsEl.innerHTML =
      "尚無完成的錄音分段";


    startBtn.disabled =
      true;


    stopBtn.disabled =
      false;


    totalTimer =
      setInterval(
        updateTimers,
        250
      );


    segmentTimer =
      setInterval(
        checkSegmentLimit,
        1000
      );


    startSegment();


    showMessage(
      `會議錄音已開始。`
      + `目前設定：每 ${segmentMinutes.value} 分鐘自動分段。`,
      "success"
    );


  } catch (error) {

    console.error(
      error
    );


    let message =
      "無法開始錄音。\n\n"
      + "錯誤名稱："
      + error.name
      + "\n"
      + "錯誤訊息："
      + error.message;


    if (
      error.name ===
      "NotAllowedError"
    ) {

      message +=
        "\n\nChrome 拒絕了麥克風權限。"
        + "\n請確認網站麥克風權限已允許。";

    }


    showMessage(
      message,
      "error"
    );


    statusEl.textContent =
      "錄音啟動失敗";

  }

}


/* =====================================================
   結束會議
===================================================== */

function stopMeeting() {

  if (
    !isRecording
  ) {

    return;

  }


  stoppingMeeting =
    true;


  /*
   * 不要立刻把 isRecording 設成 false。
   * 必須讓最後一段 Recorder 完成 onstop，
   * 才能確保最後一段音訊 Blob 被建立。
   */

  statusEl.textContent =
    `⏳ 正在完成第 ${segmentIndex} 段…`;

  statusEl.className =
    "status rotating";


  if (
    segmentTimer
  ) {

    clearInterval(
      segmentTimer
    );

    segmentTimer =
      null;

  }


  if (
    mediaRecorder &&
    mediaRecorder.state !==
    "inactive"
  ) {

    mediaRecorder.stop();

  } else {

    finishMeetingAfterLastSegment();

  }

}


/* =====================================================
   最後一段完成後結束
===================================================== */

function finishMeetingAfterLastSegment() {

  isRecording =
    false;


  stoppingMeeting =
    false;


  rotatingSegment =
    false;


  if (
    totalTimer
  ) {

    clearInterval(
      totalTimer
    );

    totalTimer =
      null;

  }


  if (mediaStream) {

    mediaStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    mediaStream =
      null;

  }


  startBtn.disabled =
    false;


  stopBtn.disabled =
    true;


  progressBar.style.width =
    "0%";


  statusEl.textContent =
    "✅ 會議錄音完成";

  statusEl.className =
    "status idle";


  segmentInfo.textContent =
    `共完成 ${completedSegmentCount} 個錄音分段`;


  showMessage(
    `會議錄音完成，共 ${completedSegmentCount} 個分段。`,
    "success"
  );


  mediaRecorder =
    null;

}


/* =====================================================
   防止誤關閉
===================================================== */

window.addEventListener(
  "beforeunload",
  function(event) {

    if (
      isRecording
    ) {

      event.preventDefault();

      event.returnValue =
        "";

    }

  }
);


/* =====================================================
   頁面切換提醒
===================================================== */

document.addEventListener(
  "visibilitychange",
  function() {

    if (
      isRecording &&
      document.hidden
    ) {

      showMessage(
        "⚠️ 錄音頁面目前不在前景。"
        + "請避免關閉分頁、關閉 Chrome "
        + "或讓系統停止瀏覽器，"
        + "以降低長時間錄音中斷風險。",
        "warning"
      );

    }

  }
);


/* =====================================================
   選擇分段時間
===================================================== */

segmentMinutes.addEventListener(
  "change",
  function() {

    if (
      isRecording
    ) {

      /*
       * 錄音開始後禁止改變分段設定，
       * 避免本段計時基準混亂。
       */

      showMessage(
        "錄音進行中不能修改分段時間。"
        + "請先結束目前會議，再重新設定。",
        "warning"
      );

      return;

    }


    summaryInterval.textContent =
      `每 ${segmentMinutes.value} 分鐘`;

  }
);


/* =====================================================
   按鈕
===================================================== */

startBtn.addEventListener(
  "click",
  startMeeting
);

stopBtn.addEventListener(
  "click",
  stopMeeting
);

</script>

</body>
</html>
